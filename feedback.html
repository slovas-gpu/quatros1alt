<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Feedback</title>
	<style>
		body {
			align-items: center;
			display: flex;
			flex-direction: column;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
			padding: 24px;
			text-align: center;
		}

		form {
			align-items: center;
			display: flex;
			flex-direction: column;
			gap: 12px;
			max-width: 420px;
			width: 100%;
		}

		textarea {
			box-sizing: border-box;
			font: inherit;
			padding: 12px;
			resize: vertical;
			width: 100%;
		}

		button,
		form a {
			background-color: #1769e0;
			border: 0;
			border-radius: 6px;
			color: #ffffff;
			cursor: pointer;
			font-size: 1.1rem;
			font-weight: 700;
			min-height: 52px;
			padding: 12px 32px;
			text-decoration: none;
			width: 100%;
		}

		button:hover,
		form a:hover {
			background-color: #0f4fae;
		}
	</style>
</head>
<body>
	<header>
		<h1>Add text</h1>
	</header>

	<main>
		<p>Add text</p>

		<form action="mailto:davisdesue@gmail.com,slovak4096@gmail.com" method="post" enctype="text/plain">
			<label for="feedback">Feedback</label><br>
			<textarea id="feedback" name="feedback" rows="8" cols="50" required></textarea><br><br>
			<button type="submit">Submit</button>
			<a href="subnet.html">Back</a>
		</form>
	</main>
</body>
</html>
